version: 2

models:
  - name: events__bonds
    description: "One row per `bond` event: RUNE bonded to, rewarded to, returned from or charged to a node."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: chain
        description: "{{ doc('chain') }}"
      - name: from_address
        description: "{{ doc('from_address') }}"
      - name: to_address
        description: "{{ doc('to_address') }}"
      - name: asset
        description: "{{ doc('asset') }}"
      - name: amount
        description: "Amount of `asset` in the transaction, real units."
      - name: amount_e8
        description: "`amount` as a raw chain integer (1e-8 units)."
      - name: bond_type
        description: "`bond_paid`, `bond_reward`, `bond_returned` or `bond_cost`."
      - name: bond_amount
        description: "RUNE moved by the event, real units."
      - name: bond_amount_e8
        description: "`bond_amount` as a raw chain integer (1e-8 units)."
      - name: bond_change
        description: "Change to total bonded RUNE: positive for `bond_paid` and `bond_reward`, negative for `bond_returned` and `bond_cost`."
      - name: bond_change_e8
        description: "`bond_change` as a raw chain integer (1e-8 units)."
      - name: bond_address
        description: "Bond provider's address."
      - name: node_address
        description: "{{ doc('node_address') }}"
      - name: signer_address
        description: "Address that signed the transaction."
      - name: tx_type
        description: "{{ doc('tx_type') }}"
      - name: memo
        description: "{{ doc('memo') }}"
  - name: events__contract_events
    description: "One row per CosmWasm contract event (`wasm-*`)."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: contract_address
        description: "Contract that emitted the event."
      - name: contract_type
        description: "Event type, without the `wasm-` prefix."
      - name: sender_address
        description: "Address that called the contract."
      - name: attributes
        description: "Event attributes (JSON)."
      - name: msg
        description: "Message the contract was called with (JSON)."
      - name: funds
        description: "Funds sent with the call."
  - name: events__contract_instantiations
    description: "One row per `instantiate` event: a CosmWasm contract instantiated."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: contract_address
        description: "Address of the new contract."
      - name: admin_address
        description: "Admin of the contract."
      - name: code_id
        description: "Stored code the contract was created from."
      - name: sender_address
        description: "Address that instantiated the contract."
      - name: label
        description: "Contract label."
      - name: msg
        description: "Instantiation message (JSON)."
      - name: funds
        description: "Funds sent with the instantiation."
  - name: events__donations
    description: "One row per `donate` event: assets added to a pool's depth without issuing liquidity units."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: chain
        description: "{{ doc('chain') }}"
      - name: from_address
        description: "{{ doc('from_address') }}"
      - name: to_address
        description: "{{ doc('to_address') }}"
      - name: pool
        description: "{{ doc('pool') }}"
      - name: asset
        description: "{{ doc('asset') }}"
      - name: asset_amount
        description: "Asset donated, real units."
      - name: asset_amount_e8
        description: "`asset_amount` as a raw chain integer (1e-8 units)."
      - name: rune_amount
        description: "RUNE donated, real units."
      - name: rune_amount_e8
        description: "`rune_amount` as a raw chain integer (1e-8 units)."
      - name: tx_type
        description: "{{ doc('tx_type') }}"
      - name: memo
        description: "{{ doc('memo') }}"
  - name: events__errata
    description: "One row per `errata` event: a correction to pool depths after a transaction on another chain was rolled back."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "Hash of the corrected inbound transaction."
      - name: pool
        description: "{{ doc('pool') }}"
      - name: asset_amount
        description: "Change to the pool's asset depth, real units (can be negative)."
      - name: asset_amount_e8
        description: "`asset_amount` as a raw chain integer (1e-8 units)."
      - name: rune_amount
        description: "Change to the pool's RUNE depth, real units (can be negative)."
      - name: rune_amount_e8
        description: "`rune_amount` as a raw chain integer (1e-8 units)."
  - name: events__failed_deposits
    description: "One row per failed THORChain deposit transaction (`MsgDeposit`)."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: from_address
        description: "{{ doc('from_address') }}"
      - name: asset
        description: "{{ doc('asset') }}"
      - name: amount
        description: "{{ doc('amount') }}"
      - name: amount_e8
        description: "`amount` as a raw chain integer (1e-8 units)."
      - name: code
        description: "Result code; non-zero means the transaction failed."
      - name: reason
        description: "Why the deposit failed."
      - name: memo
        description: "{{ doc('memo') }}"
  - name: events__gas_reimbursements
    description: "One row per `gas` event: gas the network reimbursed to a pool for outbound transactions."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: pool
        description: "Pool reimbursed."
      - name: asset_amount
        description: "Asset spent on gas and taken from the pool, real units."
      - name: asset_amount_e8
        description: "`asset_amount` as a raw chain integer (1e-8 units)."
      - name: rune_amount
        description: "RUNE added to the pool in compensation, real units."
      - name: rune_amount_e8
        description: "`rune_amount` as a raw chain integer (1e-8 units)."
      - name: tx_count
        description: "Number of outbound transactions covered."
  - name: events__limit_swaps
    description: "One row per `limit_swap` event: a limit order placed in the swap queue."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: from_address
        description: "{{ doc('from_address') }}"
      - name: to_address
        description: "Destination address of the order."
      - name: from_asset
        description: "Asset offered."
      - name: from_amount
        description: "Amount offered, real units."
      - name: from_amount_e8
        description: "`from_amount` as a raw chain integer (1e-8 units)."
      - name: to_asset
        description: "Asset wanted."
      - name: to_amount
        description: "Minimum amount wanted, real units."
      - name: to_amount_e8
        description: "`to_amount` as a raw chain integer (1e-8 units)."
      - name: memo
        description: "{{ doc('memo') }}"
  - name: events__liquidity_adds
    description: "One row per `add_liquidity` event: liquidity added to a pool."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: pool
        description: "{{ doc('pool') }}"
      - name: asset_tx_id
        description: "Hash of the transaction that sent the asset side, if any."
      - name: asset_chain
        description: "Chain of the asset side."
      - name: asset_address
        description: "{{ doc('asset_address') }}"
      - name: asset_amount
        description: "Asset added, real units."
      - name: asset_amount_e8
        description: "`asset_amount` as a raw chain integer (1e-8 units)."
      - name: rune_tx_id
        description: "Hash of the transaction that sent the RUNE side, if any."
      - name: rune_address
        description: "{{ doc('rune_address') }}"
      - name: rune_amount
        description: "RUNE added, real units."
      - name: rune_amount_e8
        description: "`rune_amount` as a raw chain integer (1e-8 units)."
      - name: liquidity_units_added
        description: "Liquidity units issued to the provider."
      - name: asset_value_in_rune
        description: "Value of the asset added, in RUNE at the pool price of the block."
      - name: asset_value_in_rune_e8
        description: "`asset_value_in_rune` as a raw chain integer (1e-8 units)."
      - name: memo
        description: "{{ doc('memo') }}"
  - name: events__liquidity_withdrawals
    description: "One row per `withdraw` event: liquidity removed from a pool."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: chain
        description: "{{ doc('chain') }}"
      - name: from_address
        description: "Address that sent the withdrawal request."
      - name: to_address
        description: "{{ doc('to_address') }}"
      - name: pool
        description: "{{ doc('pool') }}"
      - name: asset
        description: "Asset of the withdrawal request transaction (usually a dust amount)."
      - name: amount
        description: "Amount sent with the withdrawal request, real units."
      - name: amount_e8
        description: "`amount` as a raw chain integer (1e-8 units)."
      - name: asset_amount
        description: "Asset paid out, real units."
      - name: asset_amount_e8
        description: "`asset_amount` as a raw chain integer (1e-8 units)."
      - name: rune_amount
        description: "RUNE paid out, real units."
      - name: rune_amount_e8
        description: "`rune_amount` as a raw chain integer (1e-8 units)."
      - name: liquidity_units_removed
        description: "Liquidity units burned."
      - name: basis_points
        description: "Share of the position withdrawn, in basis points (10000 = all)."
      - name: asymmetry
        description: "Asymmetry of the withdrawal: 0 for both sides, towards -1 or 1 for one side."
      - name: impermanent_loss_protection
        description: "Impermanent loss protection paid, in RUNE."
      - name: impermanent_loss_protection_e8
        description: "`impermanent_loss_protection` as a raw chain integer (1e-8 units)."
      - name: asset_value_in_rune
        description: "Value of the asset paid out, in RUNE at the pool price of the block."
      - name: asset_value_in_rune_e8
        description: "`asset_value_in_rune` as a raw chain integer (1e-8 units)."
      - name: tx_type
        description: "{{ doc('tx_type') }}"
      - name: memo
        description: "{{ doc('memo') }}"
  - name: events__messages
    description: "One row per `message` event: the sender and action of each message in a transaction."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: from_address
        description: "{{ doc('from_address') }}"
      - name: action
        description: "Message action, e.g. `deposit` or `send`."
  - name: events__mimir_changes
    description: "One row per `set_mimir` event: a Mimir setting changed by admin or by node vote."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: key
        description: "Mimir key."
      - name: value
        description: "New value."
  - name: events__mint_burns
    description: "One row per `mint_burn` event: native assets minted or burned."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: asset
        description: "{{ doc('asset') }}"
      - name: amount
        description: "{{ doc('amount') }}"
      - name: amount_e8
        description: "`amount` as a raw chain integer (1e-8 units)."
      - name: supply
        description: "Supply of the asset after the event, real units."
      - name: supply_e8
        description: "`supply` as a raw chain integer (1e-8 units)."
      - name: reason
        description: "Why the asset was minted or burned."
  - name: events__network_versions
    description: "One row per `version` event: the network protocol version changed."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: version
        description: "New version."
  - name: events__new_nodes
    description: "One row per `new_node` event: a node account registered."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: node_address
        description: "{{ doc('node_address') }}"
  - name: events__node_ip_addresses
    description: "One row per `set_ip_address` event: a node's IP address set."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: node_address
        description: "{{ doc('node_address') }}"
      - name: ip_address
        description: "IP address registered."
  - name: events__node_keys
    description: "One row per `set_node_keys` event: a node's keys registered."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: node_address
        description: "{{ doc('node_address') }}"
      - name: secp256k1_pubkey
        description: "Node's secp256k1 public key."
      - name: ed25519_pubkey
        description: "Node's ed25519 public key."
      - name: validator_consensus_pubkey
        description: "Node's validator consensus public key."
  - name: events__node_leave_requests
    description: "One row per `validator_request_leave` event: a node asking to leave."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: from_address
        description: "{{ doc('from_address') }}"
      - name: node_address
        description: "{{ doc('node_address') }}"
  - name: events__node_mimir_votes
    description: "One row per `set_node_mimir` event: a node's vote on a Mimir setting."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: node_address
        description: "{{ doc('node_address') }}"
      - name: key
        description: "Mimir key."
      - name: value
        description: "Value voted for."
  - name: events__node_versions
    description: "One row per `set_version` event: the software version a node announced."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: node_address
        description: "{{ doc('node_address') }}"
      - name: version
        description: "Version announced."
  - name: events__outbound_fees
    description: "One row per `fee` event: the network fee charged on an outbound."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: asset
        description: "{{ doc('asset') }}"
      - name: amount
        description: "Fee charged, real units of `asset`."
      - name: amount_e8
        description: "`amount` as a raw chain integer (1e-8 units)."
      - name: pool_deduct
        description: "RUNE taken from the pool to cover the fee, real units."
      - name: pool_deduct_e8
        description: "`pool_deduct` as a raw chain integer (1e-8 units)."
  - name: events__outbounds
    description: "One row per `outbound` event: a transaction THORChain sent out to a user, plus affiliate fees paid in RUNE."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
        description: "{{ doc('tx_id') }}"
      - name: in_tx_id
        description: "Hash of the inbound transaction this outbound answers."
      - name: chain
        description: "{{ doc('chain') }}"
      - name: from_address
        description: "{{ doc('from_address') }}"
      - name: to_address
        description: "{{ doc('to_address') }}"
      - name: asset
        description: "{{ doc('asset') }}"
      - name: amount
        description: "{{ doc('amount') }}"
      - name: amount_e8
        description: "`amount` as a raw chain integer (1e-8 units)."
      - name: is_internal
        description: "True when the outbound is a THORChain-native transfer rather than a transaction on another chain."
      - name: tx_type
        description: "{{ doc('tx_type') }}"
      - name: memo
        description: "{{ doc('memo') }}"
  - name: events__pending_liquidity
    description: "One row per `pending_liquidity` event: one side of a two-sided add waiting for the other, or pending liquidity being withdrawn."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: pool
        description: "{{ doc('pool') }}"
      - name: pending_type
        description: "`add` when liquidity is waiting for its other side, `withdraw` when pending liquidity is returned."
      - name: asset_tx_id
        description: "Hash of the asset-side transaction."
      - name: asset_chain
        description: "Chain of the asset side."
      - name: asset_address
        description: "{{ doc('asset_address') }}"
      - name: asset_amount
        description: "Asset pending, real units."
      - name: asset_amount_e8
        description: "`asset_amount` as a raw chain integer (1e-8 units)."
      - name: rune_tx_id
        description: "Hash of the RUNE-side transaction."
      - name: rune_address
        description: "{{ doc('rune_address') }}"
      - name: rune_amount
        description: "RUNE pending, real units."
      - name: rune_amount_e8
        description: "`rune_amount` as a raw chain integer (1e-8 units)."
  - name: events__pool_balance_changes
    description: "One row per `pool_balance_change` event: an adjustment to a pool's depths outside normal flows."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: pool
        description: "{{ doc('pool') }}"
      - name: rune_change
        description: "Change to the pool's RUNE depth, real units; negative when RUNE was removed."
      - name: rune_change_e8
        description: "`rune_change` as a raw chain integer (1e-8 units)."
      - name: asset_change
        description: "Change to the pool's asset depth, real units; negative when the asset was removed."
      - name: asset_change_e8
        description: "`asset_change` as a raw chain integer (1e-8 units)."
      - name: reason
        description: "Reason for the adjustment."
  - name: events__pool_rewards
    description: "One row per pool per `rewards` event: block rewards paid to each pool."
    data_tests:
      - unique_key:
          arguments:
            columns: [event_id, pool]
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: pool
        description: "{{ doc('pool') }}"
        data_tests:
          - not_null
      - name: pool_rewards
        description: "{{ doc('pool_rewards') }}"
      - name: pool_rewards_e8
        description: "`pool_rewards` as a raw chain integer (1e-8 units)."
      - name: saver_rewards
        description: "Rewards paid to savers in the pool, in RUNE."
      - name: saver_rewards_e8
        description: "`saver_rewards` as a raw chain integer (1e-8 units)."
  - name: events__pool_status_changes
    description: "One row per `pool` event: a change of pool status."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: pool
        description: "{{ doc('pool') }}"
      - name: status
        description: "New status: `Available`, `Staged` or `Suspended`."
  - name: events__rebonds
    description: "One row per `rebond` event: bond moved from one bond provider address to another for the same node."
    columns:
      - name: event_id
        description: "{{ doc('event_id') }}"
        data_tests:
          - unique
          - not_null
      - name: block_height
        description: "{{ doc('block_height') }}"
      - name: block_time
        description: "{{ doc('block_time') }}"
      - name: tx_id
